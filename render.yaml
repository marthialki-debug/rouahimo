# Blueprint optionnel Render (Infrastructure as Code).
# Vous pouvez aussi creer le Web Service a la main (voir LISEZMOI-RENDER.txt).
services:
  - type: web
    name: rouahimo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        value: "127.0.0.1"
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: rouahimo
      - key: DB_USER
        value: rouahimo
      - key: DB_PASS
        value: rouahimo